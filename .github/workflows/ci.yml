name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File
          foreach ($f in $files) {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              throw "Parse error in $($f.FullName): $($errs[0].Message)"
            }
          }

      - name: Install analyzer and test modules
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -AllowClobber
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $settings = Join-Path $PWD "PSScriptAnalyzerSettings.psd1"
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($issues.Count) issue(s)."
          }

      - name: Run GUI modular smoke
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          .\validation\gui_modular_smoke.ps1

      - name: Run Pester tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $coverageTargets = @(
            ".\gui\core\state.ps1",
            ".\gui\core\validation.ps1",
            ".\lib\report.ps1",
            ".\lib\cycle.ps1",
            ".\lib\probes.ps1",
            ".\lib\routing.ps1",
            ".\lib\host-port.ps1"
          )
          $result = Invoke-Pester -Path .\tests -PassThru -CodeCoverage $coverageTargets
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }
          $analyzed = 0.0
          $missed = 0.0
          if ($null -ne $result.CodeCoverage) {
            if ($result.CodeCoverage.PSObject.Properties.Name -contains "NumberOfCommandsAnalyzed") {
              $analyzed = [double]$result.CodeCoverage.NumberOfCommandsAnalyzed
            } elseif ($result.CodeCoverage.PSObject.Properties.Name -contains "AnalyzedCommands") {
              $analyzed = [double]@($result.CodeCoverage.AnalyzedCommands).Count
            }
            if ($result.CodeCoverage.PSObject.Properties.Name -contains "MissedCommands") {
              $missed = [double]@($result.CodeCoverage.MissedCommands).Count
            }
          }
          $coverage = if ($analyzed -gt 0) { (1.0 - ($missed / $analyzed)) * 100.0 } else { 0.0 }
          Write-Host ("Code coverage (targeted files): " + [math]::Round($coverage, 2) + "%")
          if ($coverage -lt 55.0) {
            throw "Pester code coverage on targeted files is below threshold (55%)."
          }
