name: ci

on:
  push:
  pull_request:

jobs:
  windows-quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path . -Recurse -Filter *.ps1 -File
          foreach ($f in $files) {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              throw "Parse error in $($f.FullName): $($errs[0].Message)"
            }
          }

      - name: Install analyzer and test modules
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $settings = Join-Path $PWD "PSScriptAnalyzerSettings.psd1"
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings
          if ($issues) {
            $issues | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($issues.Count) issue(s)."
          }

      - name: Run GUI modular smoke
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          .\validation\gui_modular_smoke.ps1

      - name: Run Pester tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failing test(s)."
          }
